name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: payment-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-image:
    name: Lint, test and image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Run local-equivalent Payment gate
        shell: pwsh
        run: ./scripts/verify-local.ps1
