name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: payment-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-image:
    name: Lint, test and image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Verify Python syntax
        run: python -m compileall -q app tests wsgi.py

      - name: Test
        run: python -m pytest

      - name: Build container image
        run: docker build --label "org.opencontainers.image.revision=${GITHUB_SHA}" --tag "ecommerce-payment:sha-${GITHUB_SHA}" .
