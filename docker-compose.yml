services:
  payment-api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/ecommerce_payment
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-development-secret}
    ports:
      - "5002:5000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ecommerce_payment
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - payment-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce_payment"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  payment-postgres:
